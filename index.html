<!DOCTYPE html>
<html>
<head>
  <title>Power BI Report Dashboard</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    .powerbi-container {
      width: 100%;
      max-width: 900px;     /* Looks good on laptop/desktop */
      margin: 0 auto;       /* Center on page */
      height: 80vh;
      min-height: 400px;
    }
    .powerbi-container iframe {
      width: 100%;
      height: 100%;
      border: 0;
    }
    @media (max-width: 600px) {
      .powerbi-container {
        max-width: 100vw;
        height: 90vh;
        min-height: 300px;
      }
    }
  </style>
</head>
<body>
  <div class="powerbi-container">
    <iframe 
      title="openlinks powerbi Drill down cross report" 
      src="https://app.powerbi.com/view?r=eyJrIjoiNDU1MDE5ODUtYWZjNi00ZDc1LWFiNGYtMzFhMjdjNjlmM2JmIiwidCI6IjczMGE1MTU5LTVhOWYtNGI2Ny04NjkyLWQwN2E3MmVkYmNiNiJ9"

</body>
</html>
