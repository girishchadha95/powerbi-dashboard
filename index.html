<style>
  /* Container to make iframe responsive */
  .responsive-iframe-container {
    position: relative;
    width: 100%;
    /* Aspect ratio 16:9 (height / width * 100) */
    padding-bottom: 216%; /* Based on your height/width ratio 852/393 */
    height: 0;
    overflow: hidden;
  }
  .responsive-iframe-container iframe {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    border: 0;
  }
</style>
</head>
<body>
<div class="responsive-iframe-container">
<iframe title="openlinks powerbi new 12" width="600" height="373.5" src="https://app.powerbi.com/view?r=eyJrIjoiMzNkMTVmYjItNDdjYi00ZTlmLWIxYmEtY2YwNTc2ZTBkNWQ5IiwidCI6IjczMGE1MTU5LTVhOWYtNGI2Ny04NjkyLWQwN2E3MmVkYmNiNiJ9" frameborder="0" allowFullScreen="true"></iframe>
