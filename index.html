<!DOCTYPE html>
<html>
<head>
<title>Power BI Report Dashboard</title>
<meta name="viewport" content="width=device-width, initial-scale=1"> <!-- This is critical for mobile view -->
<style>
  .responsive-iframe-container {
    position: relative;
    width: 100%;
    padding-bottom: 216%; /* aspect ratio */
    height: 0;
    overflow: hidden;
  }
  .responsive-iframe-container iframe {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    border: 0;
    /* Optional: Force the embedded report to scale down on small screens */
    transform-origin: top left;
  }
  
  /* Additional media query to tweak height or scaling on small devices */
  @media only screen and (max-width: 600px) {
    .responsive-iframe-container {
      padding-bottom: 150%; /* reduce height ratio for better mobile fit */
    }
    .responsive-iframe-container iframe {
      /* You can apply scale here if needed */
      /* transform: scale(0.9); */ 
      /* Adjust height or allow overflow for scrolling */
    }
  }
</style>
</head>
